<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login Page with Toggle Sound & Eye Icons</title>
  <style>
    :root {
      --primary-color: #e60000;
      --hover-color: #cc0000;
      --link-color: #0056b3;

      --bg-color: #f0f0f0;
      --card-bg: #ffffff;
      --text-color: #333;
      --input-border: #ccc;
      --error-color: #d8000c;
      --error-background: #ffd2d2;
      --button-text-color: #ffffff;
    }

    body.dark {
      --bg-color: #181a20;
      --card-bg: #23262f;
      --text-color: #f1f1f1;
      --input-border: #353945;
      --link-color: #82aaff;
      --error-background: #2d1a1a;
      --error-color: #ff7a7a;
      --button-text-color: #fff;
      /* New enhancements */
      --shadow-dark: 0 4px 24px rgba(0, 0, 0, 0.45);
      --primary-color: #ff5252;
      --hover-color: #ff1744;
    }

    /* Enhance background with a subtle gradient */
    body.dark {
      background: linear-gradient(135deg, #181a20 0%, #23262f 60%, #20222b 100%);
      transition: background 0.5s cubic-bezier(.4, 0, .2, 1), color 0.3s;
    }

    /* Card shadow and border for depth */
    body.dark .login {
      background-color: var(--card-bg);
      box-shadow: var(--shadow-dark);
      border: 1px solid #23262f;
      transition: background-color 0.4s, box-shadow 0.4s;
    }

    /* Input fields: glassy effect and border */
    body.dark .login__input {
      background: rgba(36, 37, 42, 0.7);
      border: 1px solid var(--input-border);
      color: var(--text-color);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
      transition: background 0.3s, border-color 0.3s, color 0.3s;
    }

    /* Input focus: accent border */
    body.dark .login__input:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 2px rgba(255, 82, 82, 0.15);
    }

    /* Button: vibrant color and glow on hover */
    body.dark .login__button {
      background: linear-gradient(90deg, #ff5252 0%, #ff1744 100%);
      color: #fff;
      box-shadow: 0 2px 8px rgba(255, 23, 68, 0.15);
      border: none;
      transition: background 0.3s, box-shadow 0.3s;
    }

    body.dark .login__button:hover {
      background: linear-gradient(90deg, #ff1744 0%, #ff5252 100%);
      box-shadow: 0 4px 16px rgba(255, 23, 68, 0.25);
    }

    /* Links: brighter and underline on hover */
    body.dark .login__forgot-password a {
      color: var(--link-color);
      text-shadow: 0 1px 4px #23262f;
    }

    body.dark .login__forgot-password a:hover {
      text-decoration: underline;
      color: #fff;
    }

    /* Error message: more contrast */
    body.dark .login__error {
      background-color: var(--error-background);
      color: var(--error-color);
      border: 1px solid #ff7a7a;
    }

    /* Toggle switch: dark track and thumb */
    body.dark .slider {
      background: linear-gradient(90deg, #23262f 0%, #353945 100%);
    }

    body.dark .slider::before {
      background: #23262f;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    /* Eye icon: lighter in dark mode */
    body.dark .toggle-visibility svg {
      stroke: #fff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #e0e7ff 0%, #f5f7fa 100%);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      transition: background 0.5s cubic-bezier(.4, 0, .2, 1), color 0.3s;
      position: relative;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background: url("https://www.transparenttextures.com/patterns/cubes.png") repeat;
      opacity: 0.04;
      pointer-events: none;
    }

    main {
      width: 100%;
      padding: 1rem;
    }

    /* === Dark Mode Toggle Switch === */
    .theme-switch-wrapper {
      position: absolute;
      top: 1rem;
      right: 1rem;
      user-select: none;
    }

    .theme-switch {
      display: inline-flex;
      align-items: center;
      cursor: pointer;
    }

    .theme-switch input {
      display: none;
    }

    .slider {
      position: relative;
      width: 54px;
      height: 28px;
      background: linear-gradient(90deg, #ffe082 0%, #90caf9 100%);
      border-radius: 34px;
      transition: background 0.4s cubic-bezier(.4, 0, .2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      cursor: pointer;
      overflow: visible;
    }

    .slider::before {
      content: "";
      position: absolute;
      left: 3px;
      top: 3px;
      width: 22px;
      height: 22px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
      transition: left 0.35s cubic-bezier(.4, 0, .2, 1), background 0.3s;
      z-index: 1;
    }

    input:checked+.slider {
      background: linear-gradient(90deg, #263238 0%, #37474f 100%);
    }

    input:checked+.slider::before {
      left: 29px;
      background: #222;
    }

    .slider:active::before {
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
    }

    .slider .icon {
      pointer-events: none;
    }

    .slider .sun,
    .slider .moon {
      position: absolute;
      top: 50%;
      transform: translateY(-50%) scale(1);
      font-size: 18px;
      z-index: 2;
      user-select: none;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
    }

    .slider .sun {
      left: 8px;
      color: #fbc02d;
      opacity: 1;
    }

    .slider .moon {
      right: 8px;
      color: #ffd700;
      opacity: 0;
      transform: translateY(-50%) scale(0.8);
    }

    /* Show/hide icons based on theme */
    body.dark .slider .sun {
      opacity: 0;
      transform: translateY(-50%) scale(0.8);
    }

    body.dark .slider .moon {
      opacity: 1;
      transform: translateY(-50%) scale(1);
    }

    /* Focus ring for accessibility */
    .theme-switch input:focus+.slider::before {
      outline: 2px solid #1976d2;
      outline-offset: 2px;
    }

    /* === Login Box === */
    .login {
      background-color: var(--card-bg);
      max-width: 400px;
      margin: 0 auto;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.1);
      transition: background-color 0.3s ease;
      position: relative;
    }

    .login__title {
      text-align: center;
      margin-bottom: 1.5rem;
      font-size: 1.8rem;
    }

    .login__form-group {
      margin-bottom: 1.25rem;
      position: relative;
    }

    .login__label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    .login__input {
      width: 100%;
      padding: 0.75rem 2.5rem 0.75rem 0.75rem;
      border: 1px solid var(--input-border);
      border-radius: 4px;
      font-size: 1rem;
      background-color: transparent;
      color: var(--text-color);
      height: 40px;
      line-height: 1.2;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      background: rgba(255, 255, 255, 0.6);
      transition: box-shadow 0.3s, border-color 0.3s, background 0.3s;
    }

    body.dark .login__input {
      background: rgba(36, 37, 42, 0.85);
      border: 1px solid var(--input-border);
    }

    .login__input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(230, 0, 0, 0.08);
      background: #fff;
    }

    body.dark .login__input:focus {
      background: #23262f;
    }

    .login__forgot-password {
      text-align: right;
      margin-top: 0.5rem;
      font-size: 0.9rem;
    }

    .login__forgot-password a {
      color: var(--link-color);
      text-decoration: none;
    }

    .login__forgot-password a:hover {
      text-decoration: underline;
    }

    .login__button {
      width: 100%;
      padding: 0.75rem;
      background-color: var(--primary-color);
      border: none;
      border-radius: 4px;
      color: var(--button-text-color);
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .login__button:hover {
      background-color: var(--hover-color);
    }

    .login__error {
      background-color: var(--error-background);
      color: var(--error-color);
      padding: 0.75rem;
      border-radius: 4px;
      margin-bottom: 1rem;
      display: none;
      font-size: 0.95rem;
    }

    /* Eye icon button */
    .toggle-visibility {
      position: absolute;
      top: 50%;
      right: 0.75rem;
      transform: translateY(-50%);
      background: none;
      border: none;
      padding: 0;
      margin: 0;
      cursor: pointer;
      width: 32px;
      color: var(--text-color);
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .toggle-visibility svg {
      width: 20px;
      height: 20px;
      stroke: var(--text-color);
      fill: none;
      display: block;
    }

    /* Mask username input text with dots */
    .masked-username {
      -webkit-text-security: disc;
      text-security: disc;
      font-family: monospace;
    }

    @media (max-width: 480px) {
      .login {
        padding: 1.5rem;
      }

      .login__title {
        font-size: 1.5rem;
      }
    }

    .slider .sun::before {
      content: "☀️";
    }

    .slider .moon::before {
      content: "🌙";
    }
  </style>
</head>

<body>
  <!-- Dark Mode Toggle -->
  <div class="theme-switch-wrapper" role="switch" aria-checked="false" aria-label="Toggle dark mode">
    <label class="theme-switch" for="darkModeToggle">
      <input type="checkbox" id="darkModeToggle" />
      <span class="slider">
        <span class="icon sun"></span>
        <span class="icon moon"></span>
      </span>
    </label>
  </div>

  <main>
    <section class="login" role="form" aria-label="Login form">
      <h2 class="login__title">Login</h2>
      <div id="error-message" class="login__error" role="alert"></div>
      <form id="login-form" novalidate>
        <div class="login__form-group">
          <label for="username" class="login__label">User Name</label>
          <input type="text" id="username" name="username" class="login__input masked-username"
            placeholder="Enter your username" required autocomplete="username" />
          <button type="button" class="toggle-visibility" aria-label="Toggle username visibility" aria-pressed="true"
            tabindex="0">
            <!-- Eye closed icon SVG (masked) -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" fill="none">
              <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a16.39 16.39 0 0 1 5-5.18"></path>
              <path d="M1 1l22 22"></path>
              <path d="M9.53 9.53a3 3 0 0 0 4.24 4.24"></path>
            </svg>
          </button>
        </div>
        <div class="login__form-group">
          <label for="password" class="login__label">Password</label>
          <input type="password" id="password" name="password" class="login__input" placeholder="Enter your password"
            required autocomplete="current-password" />
          <button type="button" class="toggle-visibility" aria-label="Toggle password visibility" aria-pressed="true"
            tabindex="0">
            <!-- Eye closed icon SVG (masked) -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" fill="none">
              <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a16.39 16.39 0 0 1 5-5.18"></path>
              <path d="M1 1l22 22"></path>
              <path d="M9.53 9.53a3 3 0 0 0 4.24 4.24"></path>
            </svg>
          </button>
        </div>
        <div class="login__forgot-password">
          <a href="#">Forgot password?</a>
        </div>
        <button type="submit" class="login__button">Login</button>
      </form>
    </section>
  </main>

  <script>
    // Dark Mode Toggle Sound (base64 short click sound)
    const toggleSound = new Audio(
      "data:audio/mp3;base64,//uQxAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAACcQCAAMEZAAABAAgAZGF0YYAAAAD//wQAAABhZGF0YQAAAA=="
    );
    toggleSound.volume = 0.5;

    const toggle = document.getElementById("darkModeToggle");
    const body = document.body;
    const themeSwitchWrapper = document.querySelector(".theme-switch-wrapper");

    function applyTheme(theme, playSound = false) {
      if (theme === "dark") {
        body.classList.add("dark");
        toggle.checked = true;
        themeSwitchWrapper.setAttribute("aria-checked", "true");
      } else {
        body.classList.remove("dark");
        toggle.checked = false;
        themeSwitchWrapper.setAttribute("aria-checked", "false");
      }

      if (playSound) {
        try {
          toggleSound.currentTime = 0;
          toggleSound.play();
        } catch (e) {
          console.warn("Sound playback failed", e);
        }
      }

      localStorage.setItem("theme", theme);
    }

    toggle.addEventListener("change", () => {
      const newTheme = toggle.checked ? "dark" : "light";
      applyTheme(newTheme, true);
    });

    // On page load, set theme from localStorage or default to light
    const savedTheme = localStorage.getItem("theme") || "light";
    applyTheme(savedTheme);

    // Login form logic
    const form = document.getElementById("login-form");
    const errorMessage = document.getElementById("error-message");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!username || !password) {
        errorMessage.style.display = "block";
        errorMessage.textContent = "Please enter both username and password.";
        return;
      }

      if (username !== "admin" || password !== "1234") {
        errorMessage.style.display = "block";
        errorMessage.textContent = "Invalid username or password.";
        return;
      }

      errorMessage.style.display = "none";
      alert("Login successful!");
    });

    // SVG icons for toggle buttons
    const eyeShowSVG = `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>`;

    const eyeHideSVG = `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a16.39 16.39 0 0 1 5-5.18"></path>
        <path d="M1 1l22 22"></path>
        <path d="M9.53 9.53a3 3 0 0 0 4.24 4.24"></path>
      </svg>`;

    // Toggle visibility for username and password fields
    document.querySelectorAll(".toggle-visibility").forEach((button) => {
      button.addEventListener("click", () => {
        const input = button.previousElementSibling;
        if (!input) return;

        if (input.id === "password") {
          // Toggle password type
          if (input.type === "password") {
            input.type = "text";
            button.innerHTML = eyeShowSVG;
            button.setAttribute("aria-pressed", "false");
          } else {
            input.type = "password";
            button.innerHTML = eyeHideSVG;
            button.setAttribute("aria-pressed", "true");
          }
        } else if (input.id === "username") {
          // Toggle masked-username class for username
          if (input.classList.contains("masked-username")) {
            input.classList.remove("masked-username");
            button.innerHTML = eyeShowSVG;
            button.setAttribute("aria-pressed", "false");
          } else {
            input.classList.add("masked-username");
            button.innerHTML = eyeHideSVG;
            button.setAttribute("aria-pressed", "true");
          }
        }
      });
    });

    // On load, sync icons with initial states
    document.querySelectorAll(".toggle-visibility").forEach((button) => {
      const input = button.previousElementSibling;
      if (!input) return;

      if (input.id === "password") {
        if (input.type === "password") {
          button.innerHTML = eyeHideSVG;
          button.setAttribute("aria-pressed", "true");
        } else {
          button.innerHTML = eyeShowSVG;
          button.setAttribute("aria-pressed", "false");
        }
      } else if (input.id === "username") {
        if (input.classList.contains("masked-username")) {
          button.innerHTML = eyeHideSVG;
          button.setAttribute("aria-pressed", "true");
        } else {
          button.innerHTML = eyeShowSVG;
          button.setAttribute("aria-pressed", "false");
        }
      }
    });
  </script>
</body>

</html>
